name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The version-bump guard compares against github.event.before, which a
          # default shallow clone does not contain.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate catalog
        run: node scripts/validate.mjs

      # The PR workflow runs this too, but a push straight to main never opens a
      # pull request, so without it a changed skill could ship without a version
      # bump and OpenCode would keep serving the cached copy to every consumer.
      - name: Check version bumps
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-version-bump.mjs

      - name: Build site
        run: node scripts/build-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
