services:
  skills-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: raulmoracode-skills:local
    ports:
      - "${SKILLS_SITE_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
